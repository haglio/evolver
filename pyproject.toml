[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolver"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "qtawesome",
    "sounddevice",
    "tzdata",
    "vosk",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "vulture"]

[tool.pytest.ini_options]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~8.5 s, so 60 s clears it seven times over and can
# only bite on a hang. The suspend/resume test in tests/test_processes.py is the
# one that spends real seconds on purpose, and it spends about one. The thread
# method prints the hung stack, which is what turns a stalled required check into
# a one-line diagnosis. tests/test_timeouts.py holds both halves of it.
addopts = "--timeout=60 --timeout-method=thread"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["evolver*"]
namespaces = false
