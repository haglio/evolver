[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolver"
version = "0.1.0"
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning, which is how this family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# this repo's venv holds today. tzdata is the exception and says so in
# [tool.haglio.dependencies] below.
# The family repos this one runs are named at the tags it was built against
# rather than left to be whatever checkouts sit beside it. Unpinned, a change
# landing in one of them reached every consumer the same minute, and one whose
# other half had not landed turned all of them red at once. Moving to a newer
# one is this repo's own commit, with its own suite to answer for it.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.340",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.294",
    # The family's listener, for the backfill tool: it brings vosk and sounddevice.
    "voice-core @ git+https://github.com/haglio/voice_core@v0.1.102",
    # What voice_core reads each command with a second time; it imports it, this repo
    # installs it.
    "faster-whisper>=1,<2",
    "numpy>=2.4,<3",
    "PyQt6>=6,<7",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "pytest-timeout>=2.4,<3", "vulture>=2.16,<3", "ruff==0.16.6"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is a child that collects the whole suite, and vulture reading
# every product file in the tree; under a second each here, both dominated by
# process start and import on Windows. Its own child guard in
# tests/test_imports_without_win32.py is 180 s, so that one still trips this
# rather than its own message. --timeout-method=thread is the half that pays
# for itself: it dumps the stack of the test that stopped, which turns a
# stalled required check into a one-line diagnosis. app_support.gates
# holds all three halves of it.
addopts = "--timeout=120 --timeout-method=thread -p app_support.sanitize.pytest_plugin -p app_support.gates.pytest_plugin -p app_support.coverage_gate --cov --cov-report="
testpaths = ["tests"]

# The family checkouts this one is installed beside. Both were imported and
# named nowhere -- this file said nothing about either while the tray and the
# stages reach for both. Neither is published, so neither can go in
# [project.dependencies]; the family's dependency gate holds this list against
# the tree instead.
[tool.haglio]
siblings = ["app_support", "shared_ui", "voice_core"]

# What the family's gates (app_support.gates) let stand here, each for the
# reason beside it. An entry nothing is reported for any more fails the gate.
[tool.haglio.dead-code]
# finished_at is a key of the run records on disk, written by asdict and never
# read back: retiring a persisted key is item 56's, not a deletion here.
unread-dataclass-fields = ["RunRecord.finished_at"]

[tool.haglio.dependencies]
# tzdata is left open on purpose: it is the time zone database, republished
# whenever a government moves a clock, and a ceiling on it would pin a fact
# about the world rather than an interface.
unbounded = ["tzdata"]

# Declared, so that every launcher here brings this checkout up to what has
# shipped, and waits out an update of it already under way, before it starts
# Evolver (app_support.production_update).
[tool.haglio.production]

# What Evolver will not open without (content_overlay.refuse_an_incomplete_overlay):
# every key content.example.json documents, in content.local.json. The production
# updater reads this at the commit it would move production to, and keeps production
# where it is while content.local.json lacks one of those keys.
[tool.haglio.opens-only-with]
every-key-of = "content.example.json"
in = "content.local.json"

# Rendered into the .vbs files beside this one by
# `python -m app_support.launcher --write`. The broker's tray names
# launch_evolver_if_not_running.vbs in its own config, and runs it when it finds
# Evolver gone.
[tool.haglio.launchers."launch_evolver.vbs"]
app = "Evolver"
interpreter = "pythonw.exe"
named-interpreter = "Evolver-Evolver.exe"
run = '"{root}\tray_app.py"'

# What the pinned shortcut runs: the same tray, with the family's loading screen
# up from the click. launch_evolver.vbs stays the start nobody clicked, which
# Evolver runs itself to take an update, so that one shows none.
[tool.haglio.launchers."launch_evolver_from_its_shortcut.vbs"]
app = "Evolver"
interpreter = "pythonw.exe"
named-interpreter = "Evolver-Evolver.exe"
run = '"{root}\tray_app.py"'
log = 'state\evolver_launcher.log'
loading-screen = ["Updating Evolver..."]

[tool.haglio.launchers."launch_evolver_if_not_running.vbs"]
app = "Evolver"
interpreter = "pythonw.exe"
named-interpreter = "Evolver-Evolver.exe"
run = '"{root}\tray_app.py" --if-not-running'

# What Restart starts once this copy has ended, when the window was open.
[tool.haglio.launchers."launch_evolver_showing_its_window.vbs"]
app = "Evolver"
interpreter = "pythonw.exe"
named-interpreter = "Evolver-Evolver.exe"
run = '"{root}\tray_app.py" --show-window'

[tool.haglio.launchers."launch_preview_branch.vbs"]
app = "Evolver (branch preview)"
interpreter = "pythonw.exe"
venv = "primary"
run = '"{root}\tray_app.py" --show-window'
log = 'state\preview_branch.log'
loading-screen = ["Updating Evolver..."]
preview = true
environment = { EVOLVER_BRANCH_SESSION = "1" }
copy-from-primary = ["content.local.json"]

# What Evolver relies on Windows to keep: the shortcut it is pinned from, and the
# one "Start with Windows" puts in the Startup folder, which gui/startup.py writes
# from this list. `python -m app_support.windows_settings --write` makes this
# machine match every checkout's list.
[tool.haglio.shortcuts."Evolver"]
launcher = "launch_evolver_from_its_shortcut.vbs"
icon = "icon.ico"
app-id = "Evolver.TrayApp"
places = ["taskbar", "checkout"]

[tool.haglio.shortcuts."Evolver in the tray"]
launcher = "launch_evolver_if_not_running.vbs"
icon = "icon.ico"
app-id = "Evolver.TrayApp"
places = ["startup"]

[tool.setuptools.packages.find]
include = ["evolver*"]
namespaces = false
