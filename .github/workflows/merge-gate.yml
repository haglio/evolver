name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# Runs on windows-latest: evolver drives Windows-only machinery (Topaz ffmpeg,
# the tray/taskbar, single-instance) and its tests assert on it -- e.g. they
# check subprocess.CREATE_NO_WINDOW, an attribute that does not exist off-Windows,
# so an ubuntu runner reports failures for behaviour that is correct.
#
# QT_QPA_PLATFORM=offscreen: the PyQt6 widget tests construct a QApplication and
# render pixmaps; the offscreen platform lets them run headless with no display.
#
# The editable install MUST use compat mode: evolver is a flat layout of many
# top-level modules (config, evolver, tasks/, util/, ...) but pyproject scopes
# packages.find to evolver* (to dodge setuptools' multi-package auto-discovery
# error). Compat mode puts the repo root itself on sys.path, which is how pytest
# imports these modules; the modern editable finder would expose only evolver*
# and leave the rest unimportable.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, compat mode)
        run: |
          python -m pip install --upgrade pip
          pip install "app_support @ git+https://github.com/haglio/app_support.git"
          pip install "shared_ui @ git+https://github.com/haglio/shared_ui.git"
          pip install -e ".[dev]" --config-settings editable_mode=compat
      - name: Run the suite
        run: python -m pytest -q
      # Again, back to front. Twelve modules used to stand a QApplication up
      # themselves, twenty-five EvolverApps were built and never taken down, and
      # a module global was assigned with no restore -- every shape that makes a
      # result depend on what ran first. Reversing inverts every "this runs
      # before that" the suite has, so the next such lean goes red on the commit
      # that introduces it. TEST_COLLECTION_ORDER=shuffle with
      # TEST_COLLECTION_SEED is the deeper local check (see tests/conftest.py);
      # the gate takes the deterministic one.
      - name: Run the suite back to front
        env:
          TEST_COLLECTION_ORDER: reverse
        run: python -m pytest -q
