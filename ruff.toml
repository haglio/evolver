    "SIM117",  # 64
    "PT027",  # 22
    "C408",  # 20
    "PLW0108",  # 10
    "PLR0913",  # 8
    "PERF401",  # 4
    "PLR0917",  # 2
    "PLR0915",  # 3
    "SIM105",  # 3
    "RUF002",  # 1
    "PLR0912",  # 1
    "PERF403",  # 2
    "PLR1714",  # 2
    "FURB192",  # 1
    "SIM102",  # 1
    "RUF005",  # 1
    "PLC3002",  # 1
    "PT019",  # 6
    "PLR0911",  # 3
